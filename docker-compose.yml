name: namelessliberty

services:
  postgre:
    container_name: NamelessLiberty-Postgre
    image: postgres:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASS}
      POSTGRES_DB: ${POSTGRE_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ~/db-data/postgres:/var/lib/postgresql
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.2
    ports:
      - "10001:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && (psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'infisical'\" | grep -q 1 || psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c \"CREATE DATABASE infisical\")",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: NamelessLiberty-Redis
    image: redis:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.3
    ports:
      - "10002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  infisical:
    container_name: NamelessLiberty-Infisical
    image: infisical/infisical:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: postgres://${POSTGRE_USER}:${POSTGRE_PASS}@postgre:5432/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SITE_URL: ${INFISICAL_SITE_URL}
    depends_on:
      postgre:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - infisical_data:/app/data
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.7
    ports:
      - "10003:8080"

  rustfs:
    container_name: NamelessLiberty-RustFS
    image: rustfs/rustfs:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - /mnt/wdext/rustfs/data:/data
      - rustfs_logs:/app/logs
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.4
    ports:
      - "10004:9000"
      - "10005:9001"

  deemix:
    container_name: NamelessLiberty-Deemix
    image: ghcr.io/bambanah/deemix:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/wdext/media/music:/downloads
      - deemix_config:/config
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.5
    ports:
      - "10006:6595"

  searxng:
    container_name: NamelessLiberty-SearXNG
    image: searxng/searxng:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.6
    ports:
      - "10007:8080"

  elysia:
    container_name: NamelessLiberty-Elysia
    build:
      context: .
      dockerfile: apps/elysia/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
      secrets:
        - app_env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    depends_on:
      postgre:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.8
    ports:
      - "10008:4000"

  next:
    container_name: NamelessLiberty-Next
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        INFISICAL_SITE_URL: ${INFISICAL_SITE_URL}
      secrets:
        - app_env
        - infisical_token
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    env_file:
      - .env
    depends_on:
      elysia:
        condition: service_started
    networks:
      NamelessLiberty:
        ipv4_address: 180.0.0.9
    ports:
      - "10009:3000"

secrets:
  app_env:
    file: .env
  infisical_token:
    environment: INFISICAL_TOKEN

networks:
  NamelessLiberty:
    name: NamelessLiberty
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 180.0.0.0/24
          gateway: 180.0.0.1

volumes:
  redis_data:
    name: NamelessLiberty-redis-data
  rustfs_logs:
    name: NamelessLiberty-rustfs-logs
  deemix_config:
    name: NamelessLiberty-deemix-config
  core-data:
    name: NamelessLiberty-searxng-cache
  infisical_data:
    name: NamelessLiberty-infisical-data

name: iris

services:
  database:
    container_name: IRIS-database
    image: postgres:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      IRIS:
        ipv4_address: 172.28.0.2
    ports:
      - "${POSTGRE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    container_name: IRIS-cache
    image: redis:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      IRIS:
        ipv4_address: 172.28.0.3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-storage:
    container_name: IRIS-fileStorage
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rustfs_data:/data
    networks:
      IRIS:
        ipv4_address: 172.28.0.4
    ports:
      - "9000:9000"

  server:
    container_name: IRIS-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      file-storage:
        condition: service_started
    networks:
      IRIS:
        ipv4_address: 172.28.0.5
    ports:
      - "${NEST_PORT:-4000}:4000"

  elysia:
    container_name: IRIS-elysia
    build:
      context: .
      dockerfile: apps/elysia/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      file-storage:
        condition: service_started
    networks:
      IRIS:
        ipv4_address: 172.28.0.7
    ports:
      - "${ELYSIA_PORT:-4000}:4000"

  web:
    container_name: IRIS-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - elysia
    networks:
      IRIS:
        ipv4_address: 172.28.0.6
    ports:
      - "3000:3000"

networks:
  IRIS:
    name: IRIS
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

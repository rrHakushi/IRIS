kind: pipeline
type: docker
name: default

steps:
  - name: Environment
    image: alpine:latest
    environment:
      ENV_FILE:
        from_secret: ENV_FILE
    commands:
      - if [ -z "$ENV_FILE" ]; then echo "WARNING: ENV_FILE secret is empty"; fi
      - printf "%s\n" "$ENV_FILE" > .env
      - chmod 600 .env

  - name: Packages
    image: node:22-alpine
    commands:
      - apk add --no-cache libc6-compat
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm turbo run build --filter="./packages/*"
    depends_on:
      - Environment

  - name: Prisma Push
    image: node:22-alpine
    commands:
      - apk add --no-cache libc6-compat openssl
      - corepack enable
      - pnpm --filter @IRIS/database db:push
    depends_on:
      - Packages

  - name: Prisma Generation
    image: node:22-alpine
    commands:
      - apk add --no-cache libc6-compat openssl
      - corepack enable
      - pnpm --filter @IRIS/database db:generate
    depends_on:
      - Prisma Push

  - name: Backend
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - docker compose build elysia
    depends_on:
      - Prisma Generation

  - name: Frontend
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - docker compose build web
      - docker compose up -d --remove-orphans
      - sleep 5
      - docker compose ps
      - docker compose logs elysia --tail=50
      - docker compose logs web --tail=50
    depends_on:
      - Backend

  - name: Cleanup
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker image prune -f
      - docker builder prune -f --keep-storage 5GB || true
    depends_on:
      - Frontend

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - main
  event:
    - push

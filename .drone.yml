kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
  - name: Clone
    image: alpine/git:latest
    commands:
      - git init
      - git remote add origin ${DRONE_REMOTE_URL} || git remote set-url origin ${DRONE_REMOTE_URL}
      - git fetch --depth=1 origin +refs/heads/${DRONE_COMMIT_BRANCH}:refs/remotes/origin/${DRONE_COMMIT_BRANCH}
      - git checkout -f ${DRONE_COMMIT_SHA}

  - name: Redis
    image: docker:latest
    environment:
      REDIS_PASSWORD:
        from_secret: REDIS_PASSWORD
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - printf "REDIS_PASSWORD=%s\n" "$REDIS_PASSWORD" > .env
      - chmod 600 .env
      - docker compose up -d redis
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' NamelessLiberty-Redis 2>/dev/null)" = "healthy" ]; then
            echo "NamelessLiberty-Redis is healthy."
            break
          fi
          sleep 2
        done
    depends_on:
      - Clone

  - name: Postgre
    image: docker:latest
    environment:
      POSTGRE_USER:
        from_secret: POSTGRE_USER
      POSTGRE_PASS:
        from_secret: POSTGRE_PASS
      POSTGRE_DB:
        from_secret: POSTGRE_DB
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - |
        cat << EOF >> .env
        POSTGRE_USER=$POSTGRE_USER
        POSTGRE_PASS=$POSTGRE_PASS
        POSTGRE_DB=$POSTGRE_DB
        EOF
      - docker compose up -d postgre
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' NamelessLiberty-Postgre 2>/dev/null)" = "healthy" ]; then
            echo "NamelessLiberty-Postgre is healthy."
            break
          fi
          sleep 2
        done
    depends_on:
      - Redis

  - name: infisical
    image: docker:latest
    environment:
      INFISICAL_ENCRYPTION_KEY:
        from_secret: INFISICAL_ENCRYPTION_KEY
      INFISICAL_AUTH_SECRET:
        from_secret: INFISICAL_AUTH_SECRET
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - |
        cat << EOF >> .env
        INFISICAL_ENCRYPTION_KEY=$INFISICAL_ENCRYPTION_KEY
        INFISICAL_AUTH_SECRET=$INFISICAL_AUTH_SECRET
        INFISICAL_SITE_URL=$INFISICAL_SITE_URL
        EOF
      - docker compose up -d --no-deps infisical
      - |
        for i in $(seq 1 30); do
          if [ "$(docker inspect -f '{{.State.Running}}' NamelessLiberty-Infisical 2>/dev/null)" = "true" ]; then
            echo "NamelessLiberty-Infisical is running."
            break
          fi
          sleep 2
        done
    depends_on:
      - Postgre

  - name: Environment
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_PROJECT_ID:
        from_secret: INFISICAL_PROJECT_ID
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    commands:
      - |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        bun -e "const r = await fetch('https://github.com/Infisical/cli/releases/download/v0.45.6/cli_0.45.6_linux_' + process.argv[1] + '.tar.gz'); if (!r.ok) throw new Error('Failed to download infisical CLI: ' + r.statusText); await Bun.write('/tmp/infisical.tar.gz', r);" "$ARCH"
        tar -xzf /tmp/infisical.tar.gz -C /usr/local/bin infisical
        rm -f /tmp/infisical.tar.gz
        infisical export --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env="prod" --domain="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" --format=dotenv >> .env
      - chmod 600 .env
      - bun install --frozen-lockfile
      - cp /usr/local/bin/infisical node_modules/.bin/infisical
    depends_on:
      - infisical

  - name: RustFS
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d rustfs
    depends_on:
      - Environment

  - name: deemix
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose up -d deemix
    depends_on:
      - RustFS

  - name: searxng
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose create searxng
      - docker cp core-config/settings.yml NamelessLiberty-SearXNG:/etc/searxng/settings.yml
      - docker compose up -d searxng
    depends_on:
      - deemix

  - name: Prisma Contract
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
      INFISICAL_ENV: prod
    commands:
      - INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" bun run --filter=@Iris/db contract:emit
    depends_on:
      - searxng

  - name: Prisma Update
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    commands:
      - |
        HOST_IP=$(bun -e "const gw = (await Bun.file('/proc/net/route').text()).split(String.fromCharCode(10)).map(l => l.trim().split(String.fromCharCode(9))).find(c => c[1] === '00000000')?.[2]; console.log(gw ? gw.match(/../g).reverse().map(h => parseInt(h, 16)).join('.') : '172.17.0.1');")
        PATH="$PWD/node_modules/.bin:$PATH" INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" infisical run --env=prod -- sh -c "cd packages/database && POSTGRE_HOST=$HOST_IP POSTGRE_PORT=10001 bunx prisma db update"
    depends_on:
      - Prisma Contract

  - name: Packages
    image: oven/bun:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
      INFISICAL_ENV: prod
    commands:
      - INFISICAL_API_URL="$(printf '%s' "$INFISICAL_SITE_URL" | sed 's|/$||')/api" bun x turbo run build --filter="./packages/*"
    depends_on:
      - Prisma Update

  - name: Elysia
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - |
        PKG_VERSION=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/elysia/package.json | head -n 1)
        IS_RUNNING=$(docker inspect -f '{{.State.Running}}' NamelessLiberty-Elysia 2>/dev/null || echo "false")
        CONTAINER_VERSION=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' NamelessLiberty-Elysia 2>/dev/null || echo "")
        if [ -z "$CONTAINER_VERSION" ] && [ "$IS_RUNNING" = "true" ]; then
          CONTAINER_VERSION=$(docker cp NamelessLiberty-Elysia:/app/package.json - 2>/dev/null | sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1 || echo "")
        fi
        echo "NamelessLiberty-Elysia package.json version: $PKG_VERSION | container version: $CONTAINER_VERSION (running: $IS_RUNNING)"
        SHOULD_BUILD=1
        if [ "$IS_RUNNING" = "true" ] && [ -n "$CONTAINER_VERSION" ]; then
          if [ "$CONTAINER_VERSION" = "$PKG_VERSION" ]; then
            SHOULD_BUILD=0
          else
            OLDER=$(printf '%s\n%s\n' "$CONTAINER_VERSION" "$PKG_VERSION" | sort -V | head -n 1)
            if [ "$OLDER" = "$PKG_VERSION" ]; then
              SHOULD_BUILD=0
            fi
          fi
        fi
        if [ "$SHOULD_BUILD" = "0" ]; then
          echo "NamelessLiberty-Elysia is already up to date (v$CONTAINER_VERSION). Skipping build."
        else
          echo "Building NamelessLiberty-Elysia v$PKG_VERSION..."
          APP_VERSION="$PKG_VERSION" docker compose build --build-arg APP_VERSION="$PKG_VERSION" elysia
          APP_VERSION="$PKG_VERSION" docker compose up -d --no-deps elysia
        fi
    depends_on:
      - Packages

  - name: Next
    image: docker:latest
    environment:
      INFISICAL_TOKEN:
        from_secret: INFISICAL_TOKEN
      INFISICAL_SITE_URL:
        from_secret: INFISICAL_SITE_URL
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
      - |
        PKG_VERSION=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' apps/web/package.json | head -n 1)
        IS_RUNNING=$(docker inspect -f '{{.State.Running}}' NamelessLiberty-Next 2>/dev/null || echo "false")
        CONTAINER_VERSION=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' NamelessLiberty-Next 2>/dev/null || echo "")
        if [ -z "$CONTAINER_VERSION" ] && [ "$IS_RUNNING" = "true" ]; then
          CONTAINER_VERSION=$(docker cp NamelessLiberty-Next:/app/package.json - 2>/dev/null | sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1 || echo "")
        fi
        echo "NamelessLiberty-Next package.json version: $PKG_VERSION | container version: $CONTAINER_VERSION (running: $IS_RUNNING)"
        SHOULD_BUILD=1
        if [ "$IS_RUNNING" = "true" ] && [ -n "$CONTAINER_VERSION" ]; then
          if [ "$CONTAINER_VERSION" = "$PKG_VERSION" ]; then
            SHOULD_BUILD=0
          else
            OLDER=$(printf '%s\n%s\n' "$CONTAINER_VERSION" "$PKG_VERSION" | sort -V | head -n 1)
            if [ "$OLDER" = "$PKG_VERSION" ]; then
              SHOULD_BUILD=0
            fi
          fi
        fi
        if [ "$SHOULD_BUILD" = "0" ]; then
          echo "NamelessLiberty-Next is already up to date (v$CONTAINER_VERSION). Skipping build."
        else
          echo "Building NamelessLiberty-Next v$PKG_VERSION..."
          APP_VERSION="$PKG_VERSION" docker compose build --build-arg APP_VERSION="$PKG_VERSION" next
          APP_VERSION="$PKG_VERSION" docker compose up -d --no-deps next
        fi
    depends_on:
      - Elysia

  - name: Jellyborealis - Build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - apt-get update && apt-get install -y python3
      - python3 plugins/JellyBorealis/package.py
    depends_on:
      - Next

  - name: Jellyborealis - Release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y python3
      - python3 plugins/JellyBorealis/package.py --ci --skip-build
    depends_on:
      - Jellyborealis - Build

  - name: BorealisExtra - Build
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - apt-get update && apt-get install -y python3 file fuse libfuse2
      - python3 plugins/BorealisExtra/package.py
    depends_on:
      - Jellyborealis - Release

  - name: BorealisExtra - Release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y python3
      - python3 plugins/BorealisExtra/package.py --ci --skip-build
    depends_on:
      - BorealisExtra - Build

  - name: Verify its running
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker compose ps
      - |
        FAILED=0
        for CONTAINER in \
          NamelessLiberty-Redis \
          NamelessLiberty-Postgre \
          NamelessLiberty-Infisical \
          NamelessLiberty-RustFS \
          NamelessLiberty-Deemix \
          NamelessLiberty-SearXNG \
          NamelessLiberty-Elysia \
          NamelessLiberty-Next; do
          STATE=$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null || echo "false")
          if [ "$STATE" != "true" ]; then
            echo "ERROR: $CONTAINER is not running!"
            docker logs "$CONTAINER" --tail=50 || true
            FAILED=1
          else
            echo "OK: $CONTAINER is running."
          fi
        done
        docker compose logs elysia --tail=30
        docker compose logs next --tail=30
        exit $FAILED
    depends_on:
      - BorealisExtra - Release

  - name: Cleanup
    image: docker:latest
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - rm -f .env
      - docker image prune -f
    depends_on:
      - Verify its running
    when:
      status:
        - success
        - failure

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

trigger:
  branch:
    - main
  event:
    - push
